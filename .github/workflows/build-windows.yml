name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V3.4 regression tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile --paths src
          --hidden-import app_paths --hidden-import services.hotkey
          --hidden-import storage.database --hidden-import ui.main_window
          --hidden-import ui.task_dialog --hidden-import ui.float_window
          --hidden-import ui.settings_dialog --hidden-import ui.theme
          --hidden-import ui.controls
          --name DaKeDesk src/main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\installer.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DaKeDesk-Setup
          path: release/DaKeDesk-Setup.exe
          retention-days: 14
